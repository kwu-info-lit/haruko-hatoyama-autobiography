# Build book.epub with Re:VIEW and publish it to GitHub Pages together with the reader in public/.
# On pull requests, only build and attach the generated EPUB as an artifact.
name: Build EPUB and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      # Re:VIEW does not fail when fonts referenced by style.css are missing and
      # silently produces an EPUB without them, so check for them before building.
      - name: Check embedded fonts
        run: |
          for f in fonts/shippori3/ShipporiMincho-OTF-Regular.otf fonts/shippori3/ShipporiMincho-OTF-Bold.otf; do
            test -f "$f" || { echo "::error file=style.css::Missing font: $f"; exit 1; }
          done

      - name: Build EPUB
        run: bundle exec rake epub

      - name: Assemble site
        run: |
          mkdir _site
          cp -R public/. _site/
          cp book.epub _site/book.epub
          rm -f _site/README.md
          find _site -name .DS_Store -delete

      - uses: actions/upload-artifact@v7
        with:
          name: book-epub
          path: book.epub

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
